name: Cross-Border Arbitrage Scanner

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Scan Amazon → 1688 Arbitrage
        run: python arbitrage_scan.py
      
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-report
          path: |
            arbitrage_report.json
            arbitrage_report.md
